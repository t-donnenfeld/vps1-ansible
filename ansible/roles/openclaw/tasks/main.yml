---
# openclaw — Install OpenClaw directly on the host (not in Docker)
# Replaces the old openclaw_build role (Docker image build)
#
# Architecture:
#   - OpenClaw runs as a systemd service on the host, listening on port {{ openclaw_gateway_port | default(18789) }}
#   - Traefik routes claw.les12.fr → host.docker.internal:{{ openclaw_gateway_port | default(18789) }} via file-based config
#   - OpenClaw accesses other services via localhost with published Docker ports
#   - Config is stored at {{ openclaw_install_dir }}/config
#   - OpenClaw is installed via npm (pre-built package, no build step needed)

- name: Create OpenClaw directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ openclaw_install_dir }}"
    - "{{ openclaw_install_dir }}/config"
    - "{{ openclaw_install_dir }}/config/agents/main/agent"
    - "{{ openclaw_install_dir }}/data"
    - "{{ openclaw_install_dir }}/workspace"

- name: Install required system packages
  ansible.builtin.apt:
    name:
      - git
      - curl
      - ca-certificates
      - gnupg
    state: present
    update_cache: true

- name: Check if Node.js is already installed
  ansible.builtin.stat:
    path: /usr/bin/node
  register: node_binary

- name: Get Node.js version if installed
  ansible.builtin.command:
    cmd: node --version
  register: node_version_output
  changed_when: false
  failed_when: false
  when: node_binary.stat.exists

- name: Install Node.js LTS (via NodeSource) if not present or outdated
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
      apt-get install -y nodejs
    executable: /bin/bash
  when: >
    not node_binary.stat.exists
    or (node_version_output.stdout is defined and
        node_version_output.stdout is not match("v2[4-9]"))

- name: Install OpenClaw via npm (pre-built package)
  ansible.builtin.command:
    cmd: npm install -g openclaw@{{ openclaw_npm_version }}
  register: npm_install_result
  changed_when: "'added' in npm_install_result.stdout or 'updated' in npm_install_result.stdout"
  # Installs the pre-built OpenClaw package from npm registry
  # No build step needed — the npm package contains pre-built dist/entry.(m)js

- name: Render OpenClaw auth-profiles.json
  ansible.builtin.template:
    src: openclaw-auth-profiles.json.j2
    dest: "{{ openclaw_install_dir }}/config/agents/main/agent/auth-profiles.json"
    mode: "0600"
  no_log: true

- name: Render OpenClaw gateway config
  ansible.builtin.template:
    src: openclaw.json.j2
    dest: "{{ openclaw_install_dir }}/config/openclaw.json"
    mode: "0644"

- name: Render OpenClaw systemd service
  ansible.builtin.template:
    src: openclaw.service.j2
    dest: /etc/systemd/system/openclaw.service
    mode: "0644"

- name: Render Traefik file-based router for OpenClaw
  ansible.builtin.template:
    src: traefik-openclaw-router.yml.j2
    dest: "{{ stack_dir }}/traefik/dynamic/openclaw.yml"
    mode: "0644"

- name: Ensure OpenClaw scripts directory exists
  ansible.builtin.file:
    path: /opt/scripts
    state: directory
    mode: "0755"

- name: Render OpenClaw UFW rules script
  ansible.builtin.template:
    src: ufw-openclaw-rules.sh.j2
    dest: /opt/scripts/ufw-openclaw-rules.sh
    mode: "0750"

- name: Render OpenClaw UFW rules systemd unit
  ansible.builtin.template:
    src: ufw-openclaw-rules.service.j2
    dest: /etc/systemd/system/ufw-openclaw-rules.service
    mode: "0644"

- name: Fix permissions for OpenClaw config and data directories
  ansible.builtin.file:
    path: "{{ openclaw_install_dir }}"
    state: directory
    owner: "1000"
    group: "1000"
    recurse: true

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Verify OpenClaw binary is functional
  ansible.builtin.command:
    cmd: /usr/bin/openclaw --version
  register: openclaw_version_check
  changed_when: false
  failed_when: openclaw_version_check.rc != 0 or openclaw_version_check.stdout == ""

- name: Enable and start OpenClaw service
  ansible.builtin.systemd:
    name: openclaw
    state: started
    enabled: true

- name: Enable and start OpenClaw UFW rules service
  ansible.builtin.systemd:
    name: ufw-openclaw-rules.service
    state: started
    enabled: true

- name: Create OpenClaw config symlink for CLI
  ansible.builtin.file:
    src: "{{ openclaw_install_dir }}/config/openclaw.json"
    dest: "/home/{{ admin_user }}/.openclaw/openclaw.json"
    state: link
    force: true
  when: admin_user is defined

- name: Add OpenClaw env vars to user bashrc
  ansible.builtin.lineinfile:
    path: "/home/{{ admin_user }}/.bashrc"
    regexp: "^{{ item.regexp }}"
    line: "{{ item.line }}"
    create: true
  loop:
    - regexp: "export OPENCLAW_CONFIG_PATH="
      line: "export OPENCLAW_CONFIG_PATH={{ openclaw_install_dir }}/config/openclaw.json"
    - regexp: "export OPENCLAW_GATEWAY_TOKEN="
      line: "export OPENCLAW_GATEWAY_TOKEN={{ openclaw_gateway_token }}"
  when: admin_user is defined

- name: Wait for OpenClaw to be healthy
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ openclaw_gateway_port | default(18789) }}/health"
    method: GET
  register: openclaw_health
  retries: 12
  delay: 5
  until: openclaw_health.status == 200
  changed_when: false
  ignore_errors: true

- name: Debug OpenClaw service status if health check failed
  when: openclaw_health is failed
  block:
    - name: Check OpenClaw service status
      ansible.builtin.systemd:
        name: openclaw
      register: openclaw_service_status

    - name: Show OpenClaw service status
      ansible.builtin.debug:
        var: openclaw_service_status

    - name: Show OpenClaw service logs (last 50 lines)
      ansible.builtin.command:
        cmd: journalctl -u openclaw --no-pager -n 50
      register: openclaw_journalctl
      changed_when: false

    - name: Print OpenClaw service logs
      ansible.builtin.debug:
        var: openclaw_journalctl.stdout_lines

    - name: Check if OpenClaw binary exists and is executable
      ansible.builtin.stat:
        path: /usr/bin/openclaw
      register: openclaw_binary_check

    - name: Show binary info
      ansible.builtin.debug:
        msg:
          - "Binary exists: {{ openclaw_binary_check.stat.exists }}"
          - "Is executable: {{ openclaw_binary_check.stat.executable }}"
          - "Binary path: {{ openclaw_binary_check.stat.path }}"
          - "Node version: {{ openclaw_version_check.stdout }}"

    - name: Check npm global packages
      ansible.builtin.command:
        cmd: npm list -g openclaw --depth=0
      register: npm_list_result
      changed_when: false

    - name: Show npm global list
      ansible.builtin.debug:
        var: npm_list_result.stdout_lines

    - name: Try running OpenClaw gateway directly (capture stderr)
      ansible.builtin.command:
        cmd: timeout 5 /usr/bin/openclaw gateway --help 2>&1 || true
      register: openclaw_gateway_help
      changed_when: false

    - name: Show gateway help output
      ansible.builtin.debug:
        var: openclaw_gateway_help.stdout_lines

    - name: Fail with diagnostic info
      ansible.builtin.fail:
        msg: "OpenClaw health check failed. See debug output above for details."
      when: openclaw_health is failed

