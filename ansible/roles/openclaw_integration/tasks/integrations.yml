---
# Runtime bridge config — single YAML file that OpenClaw's webhook handler reads
# OpenClaw runs on the host, so the config is stored at /etc/openclaw/ (no container copy needed)

- name: Create OpenClaw integrations directory
  ansible.builtin.file:
    path: "/etc/openclaw"
    state: directory
    mode: "0755"

- name: Render OpenClaw integrations.yaml
  ansible.builtin.template:
    src: integrations.yaml.j2
    dest: "/etc/openclaw/integrations.yaml"
    mode: "0644"

- name: Copy integrations.yaml to OpenClaw config directory for host access
  ansible.builtin.copy:
    src: "/etc/openclaw/integrations.yaml"
    dest: "{{ openclaw_install_dir }}/config/integrations.yaml"
    remote_src: true
    mode: "0644"

