---
# deploy_stack — Deploy the full Docker Compose stack
#
# This role:
#   1. Creates directory structure for all services
#   2. Generates secrets (OIDC keys, API keys)
#   3. Renders all config templates (docker-compose, traefik, authelia, vikunja, etc.)
#   4. Validates Authelia config
#   5. Fixes volume permissions
#   6. Installs systemd unit + starts stack

- name: Create stack directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ stack_dir }}"
    - "{{ stack_dir }}/traefik"
    - "{{ stack_dir }}/traefik/dynamic"
    - "{{ stack_dir }}/authelia"
    - "{{ stack_dir }}/authelia/secrets"
    - "{{ stack_dir }}/vikunja"
    - "{{ stack_dir }}/vikunja/files"
    - "{{ stack_dir }}/jellyfin"
    - "{{ stack_dir }}/postgres/init"
    - "{{ stack_dir }}/syncthing"
    - "{{ stack_dir }}/syncthing/config"
    - "{{ stack_dir }}/syncthing/data"
    - "{{ stack_dir }}/signal"
    - "{{ stack_dir }}/opencloud"
    - "{{ stack_dir }}/rmfakecloud"

- name: Create shared obsidian vaults directory
  ansible.builtin.file:
    path: "{{ obsidian_vaults_dir }}"
    state: directory
    mode: "0775"
    owner: "1000"
    group: "1000"

- name: Validate required variables are defined
  ansible.builtin.assert:
    that:
      - domain is defined and domain | length > 0
      - stack_dir is defined and stack_dir | length > 0
      - postgres_super_password is defined and postgres_super_password | length > 0
      - vikunja_db_password is defined and vikunja_db_password | length > 0
      - oidc_client_secret is defined and oidc_client_secret | length > 0
      - vikunja_api_token is defined and vikunja_api_token | length > 0
      - email_admin is defined and email_admin | length > 0
    fail_msg: >-
      One or more required variables are undefined or empty.
      Check group_vars/vps.yml and group_vars/vps.vault.yml for missing values.
    quiet: true

- name: Check if Syncthing API key is already persisted
  ansible.builtin.stat:
    path: "{{ stack_dir }}/syncthing/config/syncthing-api-key.txt"
  register: syncthing_api_key_file

- name: Generate Syncthing API key (alphanumeric only for XML safety)
  ansible.builtin.set_fact:
    syncthing_api_key: "{{ lookup('community.general.random_string', length=40, upper=true, lower=true, digits=true, special=false) }}"
  when: not syncthing_api_key_file.stat.exists
  no_log: true

- name: Load persisted Syncthing API key
  ansible.builtin.slurp:
    path: "{{ stack_dir }}/syncthing/config/syncthing-api-key.txt"
  register: syncthing_api_key_slurp
  no_log: true
  when: syncthing_api_key_file.stat.exists

- name: Set Syncthing API key fact from persisted file
  ansible.builtin.set_fact:
    syncthing_api_key: "{{ syncthing_api_key_slurp.content | b64decode | trim }}"
  no_log: true
  when: syncthing_api_key_file.stat.exists

- name: Persist Syncthing API key for future runs
  ansible.builtin.copy:
    dest: "{{ stack_dir }}/syncthing/config/syncthing-api-key.txt"
    content: "{{ syncthing_api_key }}\n"
    mode: "0600"
  when: not syncthing_api_key_file.stat.exists
  no_log: true

- name: Ensure Authelia OIDC private key exists
  ansible.builtin.shell: |
    set -euo pipefail
    if [ ! -f "{{ authelia_oidc_private_key_path }}" ]; then
      openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out "{{ authelia_oidc_private_key_path }}"
      chmod 600 "{{ authelia_oidc_private_key_path }}"
    fi
  args:
    executable: /bin/bash

- name: Check for cached OIDC client secret hash
  ansible.builtin.stat:
    path: "{{ authelia_oidc_client_secret_hash_path }}"
  register: oidc_client_secret_hash_stat

- name: Generate hashed OIDC client secret
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - "{{ authelia_image }}"
      - authelia
      - crypto
      - hash
      - generate
      - pbkdf2
      - --password
      - "{{ oidc_client_secret }}"
      - --variant
      - sha512
      - --iterations
      - "310000"
      - --no-confirm
  register: oidc_client_secret_hash_cmd
  when: not oidc_client_secret_hash_stat.stat.exists
  no_log: true

- name: Persist hashed OIDC client secret
  ansible.builtin.copy:
    dest: "{{ authelia_oidc_client_secret_hash_path }}"
    content: "{{ oidc_client_secret_hash_cmd.stdout | regex_replace('^Digest:\\s*', '') | trim }}\n"
    mode: "0600"
  when: not oidc_client_secret_hash_stat.stat.exists
  no_log: true

- name: Load hashed OIDC client secret
  ansible.builtin.slurp:
    path: "{{ authelia_oidc_client_secret_hash_path }}"
  register: oidc_client_secret_hash_slurp
  no_log: true

- name: Set hashed OIDC client secret fact
  ansible.builtin.set_fact:
    oidc_client_secret_hash: "{{ oidc_client_secret_hash_slurp.content | b64decode | trim }}"
  no_log: true

- name: Check for cached Jellyfin OIDC client secret hash
  ansible.builtin.stat:
    path: "{{ jellyfin_oidc_client_secret_hash_path }}"
  register: jellyfin_oidc_client_secret_hash_stat

- name: Generate hashed Jellyfin OIDC client secret
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - "{{ authelia_image }}"
      - authelia
      - crypto
      - hash
      - generate
      - pbkdf2
      - --password
      - "{{ jellyfin_oidc_client_secret }}"
      - --variant
      - sha512
      - --iterations
      - "310000"
      - --no-confirm
  register: jellyfin_oidc_client_secret_hash_cmd
  when: not jellyfin_oidc_client_secret_hash_stat.stat.exists
  no_log: true

- name: Persist hashed Jellyfin OIDC client secret
  ansible.builtin.copy:
    dest: "{{ jellyfin_oidc_client_secret_hash_path }}"
    content: "{{ jellyfin_oidc_client_secret_hash_cmd.stdout | regex_replace('^Digest:\\s*', '') | trim }}\n"
    mode: "0600"
  when: not jellyfin_oidc_client_secret_hash_stat.stat.exists
  no_log: true

- name: Load hashed Jellyfin OIDC client secret
  ansible.builtin.slurp:
    path: "{{ jellyfin_oidc_client_secret_hash_path }}"
  register: jellyfin_oidc_client_secret_hash_slurp
  no_log: true

- name: Set hashed Jellyfin OIDC client secret fact
  ansible.builtin.set_fact:
    jellyfin_oidc_client_secret_hash: "{{ jellyfin_oidc_client_secret_hash_slurp.content | b64decode | trim }}"
  no_log: true

# OpenCloud is a public OIDC client (Authorization Code flow, no PKCE).
# No client_secret is needed. Authelia config:
#   - public: true
#   - token_endpoint_auth_method: none
#   - consent_mode: implicit

- name: Load Authelia OIDC private key for JWKS
  ansible.builtin.slurp:
    path: "{{ authelia_oidc_private_key_path }}"
  register: authelia_oidc_private_key_slurp
  no_log: true

- name: Set Authelia OIDC private key fact
  ansible.builtin.set_fact:
    authelia_oidc_private_key_pem: "{{ authelia_oidc_private_key_slurp.content | b64decode }}"
  no_log: true

- name: Ensure Authelia admin password hash is provided
  ansible.builtin.assert:
    that:
      - authelia_admin_password_hash is defined
      - authelia_admin_password_hash | length > 0
      - authelia_admin_password_hash.startswith("$argon2id$")
    fail_msg: >-
      authelia_admin_password_hash is missing or invalid.
      Set it in group_vars/vps.vault.yml using an Authelia argon2id hash.

- name: Render docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ stack_dir }}/docker-compose.yml"
    mode: "0644"

- name: Render stack .env file
  ansible.builtin.template:
    src: stack.env.j2
    dest: "{{ stack_dir }}/.env"
    mode: "0600"

- name: Render Traefik config
  ansible.builtin.template:
    src: traefik.yml.j2
    dest: "{{ stack_dir }}/traefik/traefik.yml"
    mode: "0644"

- name: Render Traefik middlewares
  ansible.builtin.template:
    src: middlewares.yml.j2
    dest: "{{ stack_dir }}/traefik/dynamic/middlewares.yml"
    mode: "0644"

- name: Render Postgres init SQL
  ansible.builtin.template:
    src: 01-create-dbs.sql.j2
    dest: "{{ stack_dir }}/postgres/init/01-create-dbs.sql"
    mode: "0644"

- name: Render Authelia config
  ansible.builtin.template:
    src: authelia-configuration.yml.j2
    dest: "{{ stack_dir }}/authelia/configuration.yml"
    mode: "0644"

- name: Validate Authelia configuration
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --volume
      - "{{ stack_dir }}/authelia:/config:ro"
      - "{{ authelia_image }}"
      - authelia
      - config
      - validate
      - --config
      - /config/configuration.yml
  register: authelia_config_validation
  changed_when: false
  failed_when: authelia_config_validation.rc != 0

- name: Render Authelia users database (example)
  ansible.builtin.template:
    src: authelia-users_database.yml.j2
    dest: "{{ stack_dir }}/authelia/users_database.yml"
    mode: "0644"

- name: Render Vikunja config
  ansible.builtin.template:
    src: vikunja-config.yml.j2
    dest: "{{ stack_dir }}/vikunja/config.yml"
    mode: "0644"

- name: Render Syncthing initial config
  ansible.builtin.template:
    src: syncthing-config.xml.j2
    dest: "{{ stack_dir }}/syncthing/config/config.xml"
    mode: "0644"
  # Syncthing will overwrite this on first run, but it provides a starting point
  # with insecureSkipHostcheck=true and gui.address=0.0.0.0:8384 for Traefik compatibility

- name: Render Jellyfin SSO-Auth plugin config
  ansible.builtin.template:
    src: jellyfin-sso-auth.xml.j2
    dest: "{{ stack_dir }}/jellyfin/SSO-Auth.xml"
    mode: "0644"

- name: Fix permissions for container volumes owned by UID 1000
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    recurse: true
  loop:
    - { path: "{{ stack_dir }}/vikunja/files", owner: "1000" }
    - { path: "{{ stack_dir }}/syncthing/config", owner: "1000" }
    - { path: "{{ stack_dir }}/syncthing/data", owner: "1000" }
    - { path: /var/lib/docker/volumes/stack_jellyfin_config/_data, owner: "1000" }
    - { path: /var/lib/docker/volumes/stack_jellyfin_cache/_data, owner: "1000" }

- name: Install systemd unit for stack
  ansible.builtin.template:
    src: stack.service.j2
    dest: /etc/systemd/system/stack.service
    mode: "0644"

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: Start stack service
  ansible.builtin.systemd:
    name: stack
    state: started
    enabled: true

- name: Fix permissions for container volumes owned by UID 1000
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.owner }}"
    recurse: true
  loop:
    - { path: "{{ stack_dir }}/vikunja/files", owner: "1000" }
    - { path: "{{ stack_dir }}/syncthing/config", owner: "1000" }
    - { path: "{{ stack_dir }}/syncthing/data", owner: "1000" }
    - { path: /var/lib/docker/volumes/stack_jellyfin_config/_data, owner: "1000" }
    - { path: /var/lib/docker/volumes/stack_jellyfin_cache/_data, owner: "1000" }
  # Volumes are created by Docker compose on first start, so we fix perms after
  ignore_errors: true

- name: Create Vikunja CalDAV local user (for CalDAV sync with DAVx5, Tasks.org, etc.)
  ansible.builtin.shell:
    cmd: >
      docker compose exec -T vikunja
      /app/vikunja/vikunja user create
      --username caldav
      --email "{{ email_admin }}"
      --password "{{ vikunja_caldav_password }}"
      2>&1 || true
  args:
    chdir: "{{ stack_dir }}"
  register: caldav_user_creation
  changed_when: caldav_user_creation.stdout is search("User was created successfully")
  failed_when: false
  # CalDAV clients (DAVx5, Tasks.org, OpenTasks) authenticate directly against Vikunja
  # using username/password or CalDAV token. The main user 'theo' is created via OIDC
  # (Authelia) and cannot use local password auth. A dedicated local user 'caldav' is
  # created here for CalDAV sync. Traefik routing for /dav/* bypasses Authelia.
  # See AGENTS.md "Known Issues & Resolutions" for details.

# OpenCloud (ownCloud Infinite Scale) handles OIDC internally via env vars.
# No post-deploy OIDC configuration is needed — OpenCloud reads
# OIDC_ISSUER, WEB_OIDC_CLIENT_ID, etc. from its environment at startup.
# The Authelia OIDC client is configured as a public client (Authorization Code + PKCE).

- name: Disable sync15 in rmfakecloud user profiles
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      for userprofile in /var/lib/docker/volumes/stack_rmfakecloud_data/_data/users/*/.userprofile; do
        if [ -f "$userprofile" ]; then
          if grep -q '^sync15:' "$userprofile"; then
            sed -i 's/^sync15:.*/sync15: false/' "$userprofile"
            echo "Fixed: $userprofile"
          fi
        fi
      done
    executable: /bin/bash
  register: rmfakecloud_sync15_fix
  changed_when: rmfakecloud_sync15_fix.stdout | length > 0
  failed_when: false
  # The reMarkable tablet sync client may connect with sync15 (new protocol) but
  # upload files using sync v3 protocol. When sync15 is enabled in the user profile,
  # the root hash is never persisted, causing the web UI to show empty documents
  # despite files existing on disk. Setting sync15: false forces the tablet to use
  # sync v3, which correctly persists the root hash and makes files visible in the UI.
