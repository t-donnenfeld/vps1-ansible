- name: Configure VPS
  hosts: vps
  become: true
  gather_facts: false
  vars_files:
    - group_vars/vps.yml
    - group_vars/vps.vault.yml
  vars:
    ansible_user: "{{ admin_user }}"
    ansible_port: "{{ ssh_port }}"
    ansible_ssh_private_key_file: "{{ vps_ssh_private_key_file }}"
  tasks:
    - import_role:
        name: common
      tags: common

    - import_role:
        name: security
      tags: security

    - import_role:
        name: docker
      tags: docker

    - import_role:
        name: secure_networking
      tags: secure_networking

    - import_role:
        name: wireguard
      tags: wireguard

    - import_role:
        name: openclaw
      tags: openclaw

    - import_role:
        name: rmapi
      tags: rmapi

    - import_role:
        name: deploy_stack
      tags: deploy_stack

    - import_role:
        name: backup
      tags: backup

    - import_role:
        name: openclaw_integration
      tags: openclaw_integration

    - import_role:
        name: pterodactyl
      tags: pterodactyl

    - import_role:
        name: bgutil
      tags: bgutil

    - import_role:
        name: web_phd
      tags: web_phd
