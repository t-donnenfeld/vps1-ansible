ssh_port: 22
admin_user: theo
admin_pubkey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKzg2IE4TSt6qRRzJhnrAbW945OslJPAsYfFYOv0sI75 theo"
sudo_nopasswd: true
vps_ssh_private_key_file: "~/.ssh/id_ed25519"
apt_cache_valid_time: 3600
apt_dist_upgrade: true

ssh_allow_users:
  - "{{ admin_user }}"
ssh_client_alive_interval: 300
ssh_client_alive_count_max: 2
ssh_max_auth_tries: 3
ssh_max_sessions: 5
ssh_login_grace_time: 30

ufw_logging_level: low

fail2ban_bantime: 1h
fail2ban_findtime: 10m
fail2ban_maxretry: 5
fail2ban_sender: fail2ban@{{ domain }}
fail2ban_ignoreip: "127.0.0.1/8 ::1 158.109.94.91"

unattended_update_package_lists: 1
unattended_download_upgradeable_packages: 1
unattended_autoclean_interval: 7
unattended_upgrade_enabled: 1
unattended_remove_unused_deps: true
unattended_auto_reboot: false
unattended_auto_reboot_time: "03:30"
unattended_mail_recipient: "{{ email_admin }}"
unattended_mail_only_on_error: true

# Domain / routing
domain: les12.fr
subdomain_auth: auth
subdomain_tasks: tasks
subdomain_dashboard: traefik
subdomain_jellyfin: jelly
subdomain_syncthing: sync
subdomain_openclaw: claw
subdomain_cloud: cloud
subdomain_rmfakecloud: rmcloud
subdomain_ark: ark
subdomain_ark_wings: ark-wings
subdomain_phd: phd
email_admin: theotime.donnenfeld@les12.fr

# Paths
stack_dir: /opt/stack
jellyfin_media_dir: /mnt/media

# Postgres
authelia_db_name: authelia
authelia_db_user: authelia

vikunja_db_name: vikunja
vikunja_db_user: vikunja

opencloud_db_name: opencloud
opencloud_db_user: opencloud

# Authelia OIDC
oidc_client_id: vikunja
jellyfin_oidc_client_id: jellyfin
authelia_image: authelia/authelia:latest
jellyfin_image: jellyfin/jellyfin:latest
syncthing_image: syncthing/syncthing:latest
rmfakecloud_image: ddvk/rmfakecloud
openclaw_npm_version: 2026.9.9
openclaw_install_dir: /opt/openclaw
openclaw_gateway_port: 18789
signal_image: bbernhard/signal-cli-rest-api:latest
signal_phone_number: "+34610030733"
obsidian_vaults_dir: /opt/services/shared/obsidian/vaults
authelia_oidc_jwks_key_id: "authelia-oidc-key"
authelia_oidc_jwks_algorithm: RS256
authelia_oidc_client_secret_hash_path: "{{ stack_dir }}/authelia/secrets/oidc_client_secret.hash"
jellyfin_oidc_client_secret_hash_path: "{{ stack_dir }}/authelia/secrets/jellyfin_oidc_client_secret.hash"

# OpenCloud (ownCloud Infinite Scale) — replaces Nextcloud
opencloud_client_id: opencloud
opencloud_image: owncloud/ocis:latest
opencloud_admin_password: ""
opencloud_oidc_issuer: "https://{{ subdomain_auth }}.{{ domain }}"

authelia_oidc_private_key_path: "{{ stack_dir }}/authelia/secrets/oidc_private_key.pem"

# Mail
brevo_smtp_host: smtp-relay.brevo.com
brevo_smtp_port: 587
mail_from: "noreply@les12.fr"

# Enable Traefik dashboard? (recommended: false unless protected)
traefik_dashboard: true

# Backup
backup_dir: /var/backups/server-config
backup_retention_days: 30

# AI provider API keys (set in vault)
deepseek_api_key: ""

# OpenClaw gateway token (set in vault)
openclaw_gateway_token: ""

# Syncthing API key (auto-generated, persisted)
syncthing_api_key: ""

# Vikunja CalDAV user password (local user for CalDAV sync with DAVx5, Tasks.org, etc.)
vikunja_caldav_password: ""

# Jellyfin API key (set in vault)
jellyfin_api_key: ""

# Pterodactyl game panel
pterodactyl_dir: /opt/pterodactyl
pterodactyl_panel_url: "https://{{ subdomain_ark }}.{{ domain }}"
pterodactyl_panel_timezone: "Europe/Berlin"
pterodactyl_wings_port: 2022

# bgutil yt-dlp PoT provider
bgutil_dir: /opt/bgutil
bgutil_image: brainicism/bgutil-ytdlp-pot-provider:latest
bgutil_port: 4416

# WireGuard
wireguard_address: "10.0.0.1/24"
wireguard_listen_port: 51820
wireguard_peer_allowed_ips: "10.0.0.2/32"

# PhD Research Hub (web-phd)
phd_hub_dir: /opt/phd-hub
phd_git_repo: git@github.com:tdonnenfeld/web-phd.git
phd_git_key_file: "/home/{{ admin_user }}/.ssh/id_ed25519_gittdonnenfeld"
phd_github_repos: "tdonnenfeld/web-phd,tdonnenfeld/volcomp"

# GitHub token for web-phd (set in vault; empty disables GitHub activity)
github_token: ""

